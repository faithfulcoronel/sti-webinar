<div style="width:1280px;height:560px;box-sizing:border-box;background:#F7F4EC;color:#263238;font-family:Inter,system-ui,sans-serif;font-size:16px;display:flex;flex-direction:column">
  <header style="height:64px;background:#264E43;color:#F7F4EC;display:flex;align-items:center;justify-content:center;flex-shrink:0">
    <div style="width:1024px;display:flex;align-items:center;justify-content:space-between">
      <span style="font-family:Georgia,serif;font-weight:700;font-size:20px">STI Creative Events</span>
      <span style="background:#D9B76E;color:#264E43;font-weight:600;font-size:12px;padding:4px 12px;border-radius:999px">Demo app · test data only</span>
    </div>
  </header>
  <main style="flex:1;display:flex;justify-content:center;align-items:flex-start;padding:40px 0">
    <form style="width:384px;box-sizing:border-box;background:#fff;border-radius:16px;padding:24px;box-shadow:0 4px 12px rgba(38,50,56,0.14);display:flex;flex-direction:column;gap:16px">

      <label style="display:block;font-size:14px;font-weight:600">Email
        <input type="email" value="organizer.test@example.com" style="display:block;box-sizing:border-box;width:100%;margin-top:4px;padding:10px 12px;border:1px solid rgba(38,50,56,0.3);border-radius:8px;font:inherit;font-weight:400;background:#fff;color:#263238">
      </label>
      <label style="display:block;font-size:14px;font-weight:600">Password
        <input type="password" value="testpassword" style="display:block;box-sizing:border-box;width:100%;margin-top:4px;padding:10px 12px;border:1px solid rgba(38,50,56,0.3);border-radius:8px;font:inherit;font-weight:400;background:#fff;color:#263238">
      </label>
      <button type="button" style="width:100%;padding:12px 16px;border:0;border-radius:8px;background:#264E43;color:#F7F4EC;font:inherit;font-weight:600;cursor:pointer">Sign in</button>
    </form>
  </main>
  <footer style="padding:0 128px 24px;font-size:14px;color:#5B666C">Sample project for a classroom seminar. Do not enter real student information.</footer>
</div>
